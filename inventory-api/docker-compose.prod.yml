services:
  db:
    image: postgres:18
    container_name: inventory-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/${GHCR_OWNER}/devops-inventory:${IMAGE_TAG:-latest}
    container_name: inventory-api
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ITEM_IMAGE_DIR: /app/uploads/items

    ports:
      - "8000:8000"

    volumes:
      - item_images:/app/uploads

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: ghcr.io/${GHCR_OWNER}/devops-inventory-frontend:${IMAGE_TAG:-latest}
    container_name: inventory-frontend
    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "8080:80"

volumes:
  postgres_data:
  item_images:
