name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Keep CI databases local and separate from any application database.
      DATABASE_URL: postgresql+psycopg://devops:devops@localhost:5432/inventory_ci
      TEST_DATABASE_URL: postgresql+psycopg://devops:devops@127.0.0.1:15432/inventory_test
      STOCK_CONCURRENCY_TEST_DATABASE_URL: postgresql+psycopg://devops:devops@localhost:15432/inventory_stock_concurrency_test

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: inventory_ci
          POSTGRES_USER: devops
          POSTGRES_PASSWORD: devops
        ports:
          - 5432:5432
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U devops -d inventory_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: inventory-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall app

      - name: Create isolated test databases
        env:
          PGPASSWORD: devops
        run: |
          psql -h localhost -p 5432 -U devops -d inventory_ci -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE inventory_test;"
          psql -h localhost -p 5432 -U devops -d inventory_ci -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE inventory_stock_concurrency_test;"

      - name: Run database migrations
        run: |
          alembic upgrade head

      - name: Check Alembic
        run: |
          alembic check

      - name: Migrate concurrency test database
        env:
          DATABASE_URL: postgresql+psycopg://devops:devops@localhost:15432/inventory_stock_concurrency_test
        run: |
          alembic upgrade head

      - name: Run tests
        run: |
          pytest

  docker:
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build -t inventory-api:test ./inventory-api
          docker build -t inventory-frontend:test ./frontend

  compose:
    runs-on: ubuntu-latest

    needs: test

    env:
      POSTGRES_DB: inventory
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Start Docker Compose
        working-directory: inventory-api
        run: |
            docker compose up -d --build

      - name: Check containers
        working-directory: inventory-api
        run: |
          docker compose ps

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo
              echo "API is ready"
              exit 0
            fi

            echo "Waiting for API... attempt $i/30"
            sleep 2
          done

          echo "API did not become ready"
          exit 1

      - name: Test servers endpoint
        run: |
          curl --fail --silent http://localhost:8000/servers/

      - name: Show logs
        if: always()
        working-directory: inventory-api
        run: |
          docker compose ps
          docker compose logs

      - name: Stop Docker Compose
        if: always()
        working-directory: inventory-api
        run: |
          docker compose down -v

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Check frontend types and build
        working-directory: frontend
        run: npm run build

  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    needs:
      - test
      - docker
      - compose
      - frontend

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract API Docker metadata
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/devops-inventory
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=ref,event=tag

      - name: Extract frontend Docker metadata
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/devops-inventory-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push multi-architecture API image
        uses: docker/build-push-action@v6
        with:
          context: ./inventory-api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}

      - name: Build and push multi-architecture frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publish.result == 'success' && vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    needs: publish
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Ansible
        run: python -m pip install ansible-core

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.RASPBERRY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.RASPBERRY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/raspberry_id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Prepare Ansible Vault password
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > "$RUNNER_TEMP/ansible-vault-password"

      - name: Deploy published image
        env:
          RASPBERRY_HOST: ${{ vars.RASPBERRY_HOST }}
          RASPBERRY_USER: ${{ vars.RASPBERRY_USER }}
          ANSIBLE_HOST_KEY_CHECKING: "True"
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          ansible-playbook \
            -i ansible/inventory/hosts.yml \
            ansible/playbooks/deploy.yml \
            --vault-password-file "$RUNNER_TEMP/ansible-vault-password" \
            -e "ansible_host=${RASPBERRY_HOST}" \
            -e "ansible_user=${RASPBERRY_USER}" \
            -e "ansible_ssh_private_key_file=$RUNNER_TEMP/raspberry_id_ed25519" \
            -e "image_tag=${IMAGE_TAG}" \
            -e "ghcr_owner=${GITHUB_REPOSITORY_OWNER,,}"
