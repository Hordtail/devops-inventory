name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: inventory
          POSTGRES_USER: devops
          POSTGRES_PASSWORD: devops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devops -d inventory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: inventory-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall app

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+psycopg://devops:devops@localhost:5432/inventory
        run: |
          alembic upgrade head

      - name: Check Alembic
        env:
          DATABASE_URL: postgresql+psycopg://devops:devops@localhost:5432/inventory
        run: |
          alembic check

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://devops:devops@localhost:5432/inventory
        run: |
          pytest

  docker:
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build -t inventory-api:test ./inventory-api

  compose:
    runs-on: ubuntu-latest

    needs: test

    env:
      POSTGRES_DB: inventory
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Start Docker Compose
        working-directory: inventory-api
        run: |
            docker compose up -d --build

      - name: Check containers
        working-directory: inventory-api
        run: |
          docker compose ps

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo
              echo "API is ready"
              exit 0
            fi

            echo "Waiting for API... attempt $i/30"
            sleep 2
          done

          echo "API did not become ready"
          exit 1

      - name: Test servers endpoint
        run: |
          curl --fail --silent http://localhost:8000/servers/

      - name: Show logs
        if: always()
        working-directory: inventory-api
        run: |
          docker compose ps
          docker compose logs

      - name: Stop Docker Compose
        if: always()
        working-directory: inventory-api
        run: |
          docker compose down -v
  publish:
    runs-on: ubuntu-latest

    needs:
      - test
      - docker
      - compose

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/devops-inventory
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./inventory-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}