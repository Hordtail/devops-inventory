name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: inventory
          POSTGRES_USER: devops
          POSTGRES_PASSWORD: devops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devops -d inventory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: inventory-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall app

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+psycopg://devops:devops@localhost:5432/inventory
        run: |
          alembic upgrade head

      - name: Check Alembic
        env:
          DATABASE_URL: postgresql+psycopg://devops:devops@localhost:5432/inventory
        run: |
          alembic check
