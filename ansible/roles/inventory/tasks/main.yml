---
- name: Ensure application directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Copy production Compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../inventory-api/docker-compose.prod.yml"
    dest: "{{ app_dir }}/docker-compose.prod.yml"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"

- name: Create application environment file
  ansible.builtin.copy:
    dest: "{{ app_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0600"
    content: |
      POSTGRES_DB={{ postgres_db }}
      POSTGRES_USER={{ postgres_user }}
      POSTGRES_PASSWORD={{ vault_postgres_password }}
      GHCR_OWNER={{ ghcr_owner }}
      IMAGE_TAG={{ image_tag }}
      
- name: Log in to GitHub Container Registry
  become_user: "{{ app_user }}"
  ansible.builtin.shell:
    cmd: |
      echo '{{ vault_ghcr_token }}' | docker login ghcr.io \
        --username '{{ vault_ghcr_username }}' \
        --password-stdin
  no_log: true

- name: Pull application images
  become_user: "{{ app_user }}"
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.prod.yml pull
    chdir: "{{ app_dir }}"
  register: compose_pull
  changed_when: "'Downloaded' in compose_pull.stdout or 'Pulled' in compose_pull.stdout"

- name: Start application
  become_user: "{{ app_user }}"
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.prod.yml up -d
    chdir: "{{ app_dir }}"
  register: compose_up
  changed_when: "'Started' in compose_up.stdout or 'Recreated' in compose_up.stdout"

- name: Show application status
  become_user: "{{ app_user }}"
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.prod.yml ps
    chdir: "{{ app_dir }}"
  register: compose_status
  changed_when: false

- name: Display application status
  ansible.builtin.debug:
    var: compose_status.stdout_lines

- name: Wait for Inventory API health check
  become_user: "{{ app_user }}"
  ansible.builtin.uri:
    url: http://127.0.0.1:8000/health
    method: GET
    status_code: 200
    return_content: false
    timeout: 5
  register: inventory_api_health
  until: inventory_api_health.status | default(0) == 200
  retries: 30
  delay: 5

- name: Wait for Inventory frontend health check
  become_user: "{{ app_user }}"
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/health
    method: GET
    status_code: 200
    return_content: false
    timeout: 5
  register: inventory_frontend_health
  until: inventory_frontend_health.status | default(0) == 200
  retries: 30
  delay: 5

